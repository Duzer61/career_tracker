name: career_tracker

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - path: ${CAREER_ENV_FILE:-.env}
        format: raw
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: &local_logging
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    env_file:
      - path: ${CAREER_ENV_FILE:-.env}
        format: raw
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command:
      - sh
      - -ec
      - 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes'
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *local_logging

  career:
    image: ${CAREER_IMAGE:-duzer61/career_tracker:latest}
    profiles: [application]
    env_file:
      - path: ${CAREER_ENV_FILE:-.env}
        format: raw
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ENVIRON: prod
      HOST: "0.0.0.0"
      PORT: "8000"
    # Migrations are executed explicitly by the deployment script before startup.
    entrypoint: ["/app/.venv/bin/python", "main.py"]
    ports:
      - "127.0.0.1:9500:8000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8000/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *local_logging

volumes:
  postgres_data:
  redis_data:
